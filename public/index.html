<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Idea Generator</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1>AI Business Idea Generator</h1>
    <p>Runs fully local (no Render deploy and no API key required).</p>

    <form id="idea-form">
      <label>Budget (₹)
        <input id="budget" type="number" min="1000" required value="50000" />
      </label>
      <label>Location
        <input id="location" type="text" required value="Pune" />
      </label>
      <label>Business Type
        <input id="type" type="text" required value="food" />
      </label>
      <label>Ideas Count
        <input id="count" type="number" min="1" max="20" value="5" />
      </label>
      <button type="submit">Generate Ideas</button>
    </form>

    <section>
      <h2>Generated Ideas</h2>
      <pre id="result">Fill the form and click “Generate Ideas”.</pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
